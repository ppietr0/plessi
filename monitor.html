<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Plessi · Monitor Pausa Caffè</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0d; --bg2:#131315; --line:rgba(244,241,232,.10); --line2:rgba(244,241,232,.22);
  --text:#f4f1e8; --muted:rgba(244,241,232,.62); --faint:rgba(244,241,232,.42);
  --acc:#fdd300; --ink:#0c0c0d;
  --display:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--display);-webkit-font-smoothing:antialiased;cursor:none}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

/* intestazione */
.top{display:flex;align-items:center;gap:2.6vw;padding:2vh 2.6vw 1.6vh;border-bottom:1px solid var(--line)}
.top img{height:4.6vh;min-height:30px;width:auto;display:block;flex:none}
.sp{flex:1}
.wx{display:flex;align-items:center;gap:1vw;flex:none}
.wx svg{width:clamp(22px,3.5vh,44px);height:clamp(22px,3.5vh,44px);stroke:var(--acc);fill:none;stroke-width:1.7}
.wx .deg{font-family:var(--mono);font-weight:700;font-size:clamp(17px,3vh,38px);line-height:1}
.wx .txt{font-size:clamp(11px,1.7vh,21px);color:var(--muted);white-space:nowrap}
.vr{width:1px;height:4vh;background:var(--line2);flex:none}
.clock{display:flex;align-items:baseline;gap:1.3vw;flex:none}
.clock .d{font-family:var(--mono);font-size:clamp(10px,1.6vh,20px);color:var(--faint);letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
.clock .t{font-family:var(--mono);font-weight:700;font-size:clamp(26px,4.8vh,60px);line-height:1}

/* diretta */
.stage{position:relative;overflow:hidden;background:#000}
#player,#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.badge{position:absolute;left:2.2vw;top:2.4vh;z-index:3;display:flex;align-items:center;gap:.8vw;background:rgba(12,12,13,.7);backdrop-filter:blur(8px);padding:1vh 1.5vw;border-left:3px solid var(--acc)}
.badge i{width:1vh;height:1vh;min-width:8px;min-height:8px;border-radius:50%;background:#ff3b30;box-shadow:0 0 10px rgba(255,59,48,.8);animation:puls 1.8s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.25}}
.badge span{font-family:var(--mono);font-weight:700;font-size:clamp(10px,1.6vh,20px);letter-spacing:.2em;text-transform:uppercase}

/* pannello sovrapposto (compleanni / ripiego) */
.panel{position:absolute;inset:0;z-index:4;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:0 4vw}
.panel.on{display:flex}
.panel::before{content:'';position:absolute;inset:0;opacity:.5;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:100% 8vh,8vh 100%;-webkit-mask-image:radial-gradient(130% 85% at 80% 0%,#000,transparent 70%);mask-image:radial-gradient(130% 85% at 80% 0%,#000,transparent 70%)}
.panel>*{position:relative}
.kick{display:inline-flex;align-items:center;gap:1.1vw;font-family:var(--mono);font-size:clamp(10px,1.7vh,21px);letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
.kick::before{content:'';width:3vw;max-width:54px;height:2px;background:var(--acc);flex:none}
.big{font-weight:800;font-size:clamp(28px,5.6vh,74px);line-height:1.08;letter-spacing:-.025em;max-width:22ch}
.sub{margin-top:2.6vh;font-family:var(--mono);font-size:clamp(11px,1.8vh,22px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:2.1vh}
.p{display:flex;align-items:baseline;gap:1.8vw}
.dm{font-family:var(--mono);font-weight:700;font-size:clamp(17px,3.2vh,42px);color:var(--acc);flex:none;min-width:5.5ch}
.nm{font-weight:700;font-size:clamp(21px,4.2vh,55px);letter-spacing:-.02em}
.yr{font-family:var(--mono);font-size:clamp(11px,1.7vh,21px);color:var(--muted);letter-spacing:.08em}

/* fascia sicurezza */
.ticker{background:var(--bg2);border-top:2px solid var(--acc);display:flex;align-items:stretch;overflow:hidden}
.tlabel{flex:none;display:flex;align-items:center;gap:1vw;padding:0 1.8vw;background:var(--acc);color:var(--ink)}
.tlabel svg{width:clamp(19px,2.9vh,36px);height:clamp(19px,2.9vh,36px);stroke:var(--ink);fill:none;stroke-width:1.9;flex:none}
.tlabel span{font-family:var(--mono);font-weight:700;font-size:clamp(11px,1.75vh,22px);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.tview{flex:1;overflow:hidden;display:flex;align-items:center;position:relative;min-width:0}
.tview::after{content:'';position:absolute;right:0;top:0;bottom:0;width:5vw;background:linear-gradient(to right,transparent,var(--bg2));pointer-events:none}
.track{display:flex;align-items:center;white-space:nowrap;will-change:transform;animation:scroll linear infinite}
.track .it{display:inline-flex;align-items:center;font-size:clamp(14px,2.4vh,30px);font-weight:500;padding:2.3vh 0}
.track .sep{width:.9vh;height:.9vh;min-width:7px;min-height:7px;background:var(--acc);transform:rotate(45deg);margin:0 3vw;flex:none}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation-duration:300s}}
</style>
</head>

<script>
(function(){

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function p2(n){ return n<10?'0'+n:''+n; }

  /* fascia sicurezza */
  (function(){
    var t=document.getElementById('track');
    var uno=SICUREZZA.map(function(s){ return '<span class="it">'+esc(s)+'</span><span class="sep"></span>'; }).join('');
    t.innerHTML=uno+uno;
    t.style.animationDuration=(CONFIG.secondiGiroSicurezza*SICUREZZA.length/8)+'s';
  })();

  /* orologio */
  var GG=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  var MM=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  function tick(){
    var n=new Date();
    document.getElementById('clk').textContent=p2(n.getHours())+':'+p2(n.getMinutes());
    document.getElementById('dat').textContent=GG[n.getDay()]+' '+n.getDate()+' '+MM[n.getMonth()];
  }
  tick(); setInterval(tick,20000);

  /* meteo — open-meteo, gratuito e senza chiave */
  var WMO={0:['Sereno','sun'],1:['Poco nuvoloso','sun'],2:['Parz. nuvoloso','cloud'],3:['Nuvoloso','cloud'],
    45:['Nebbia','fog'],48:['Nebbia','fog'],51:['Pioviggine','rain'],53:['Pioviggine','rain'],55:['Pioviggine','rain'],

    71:['Neve','snow'],73:['Neve','snow'],75:['Neve forte','snow'],77:['Nevischio','snow'],
    80:['Rovesci','rain'],81:['Rovesci','rain'],82:['Rovesci forti','rain'],85:['Rovesci di neve','snow'],86:['Rovesci di neve','snow'],
    95:['Temporale','storm'],96:['Temporale','storm'],99:['Temporale','storm']};
  var ICON={
    sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>',
    cloud:'<path d="M6.5 18h11a3.7 3.7 0 0 0 .3-7.4A5.6 5.6 0 0 0 7.2 9.4 4.3 4.3 0 0 0 6.5 18z"/>',
    rain:'<path d="M6.8 15.4h10.4a3.4 3.4 0 0 0 .3-6.8 5.2 5.2 0 0 0-10-1.1 4 4 0 0 0-.7 7.9z"/><path d="M9 18.4l-.8 2.4M13 18.4l-.8 2.4M17 18.4l-.8 2.4"/>',
    snow:'<path d="M6.8 15.4h10.4a3.4 3.4 0 0 0 .3-6.8 5.2 5.2 0 0 0-10-1.1 4 4 0 0 0-.7 7.9z"/><path d="M9 19.4h.01M13 19.4h.01M17 19.4h.01M11 21.4h.01M15 21.4h.01"/>',
    fog:'<path d="M4.5 10.5h15M3.5 14h17M6 17.5h12M5 7h14"/>',

  };
  function meteo(){
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+CONFIG.latitudine+'&longitude='+CONFIG.longitudine+'&current=temperature_2m,weather_code&timezone=Europe%2FRome')

        if(!j||!j.current) return;
        var w=WMO[j.current.weather_code]||['—','cloud'];
        document.getElementById('wxdeg').textContent=Math.round(j.current.temperature_2m)+'°';
        document.getElementById('wxtxt').textContent=w[0]+' · '+CONFIG.citta;
        document.getElementById('wxico').innerHTML=ICON[w[1]]||ICON.cloud;
      }).catch(function(){});
  }
  meteo(); setInterval(meteo,30*60*1000);

  /* pannello sovrapposto */
  var panel=document.getElementById('panel'), badge=document.getElementById('badge');

  }

  /* compleanni del mese */
  function compleanniDelMese(){
    var m=new Date().getMonth()+1;
    return (COMPLEANNI||[]).filter(function(c){ return c.mese===m; }).sort(function(a,b){ return a.giorno-b.giorno; });
  }
  function mostraCompleanni(){
    var nb=compleanniDelMese();
    if(!nb.length) return;
    var righe=nb.map(function(c){
      var yr=c.dal?'<span class="yr">'+(new Date().getFullYear()-c.dal)+' anni in Plessi</span>':'';
      return '<div class="p"><span class="dm">'+c.giorno+'/'+p2(c.mese)+'</span><span class="nm">'+esc(c.nome)+'</span>'+yr+'</div>';
    }).join('');
    apriPannello('<span class="kick">Auguri da tutta Plessi</span><div class="list">'+righe+'</div>', CONFIG.secondiCompleanni);
  }
  setInterval(mostraCompleanni, CONFIG.minutiTraCompleanni*60*1000);

  /* ---------- diretta TV ----------
     Costruita con l'API ufficiale di YouTube per poter INTERCETTARE
     gli errori: alcune testate vietano l'incorporamento e mostrerebbero
     una schermata d'errore. In quel caso copriamo con una scheda Plessi. */
  function direttaFallita(){
    apriPannello('<span class="kick">Plessi</span><div class="big">Dal 1953 diamo energia all\'industria.</div><div class="sub">Impianti elettrici · meccanici · speciali</div>');
  }
  window.onYouTubeIframeAPIReady=function(){ /* gestito dal controllo attivo qui sotto */ };
  function creaPlayer(){
    if(!DIRETTA){ direttaFallita(); return; }
    document.getElementById('lvname').textContent=DIRETTA_NOME||'Diretta';
    try{
      new YT.Player('player',{
        videoId:DIRETTA,
        playerVars:{autoplay:1,mute:1,controls:0,modestbranding:1,rel:0,playsinline:1,iv_load_policy:3,disablekb:1},
        events:{
          onReady:function(e){ e.target.mute(); e.target.playVideo(); },
          onError:direttaFallita
        }
      });
    }catch(e){ direttaFallita(); }
  }
  /* la richiamata onYouTubeIframeAPIReady non è affidabile su tutte le
     smart TV: controlliamo noi quando l'API è pronta */
  var yt=document.createElement('script'); yt.src='https://www.youtube.com/iframe_api';
  yt.onerror=direttaFallita;
  document.head.appendChild(yt);
  var attese=0;
  var spia=setInterval(function(){
    if(window.YT && YT.Player){ clearInterval(spia); creaPlayer(); return; }
    if(++attese>75){ clearInterval(spia); direttaFallita(); }
  },200);
  /* l'API sostituisce il contenitore CON l'iframe: il controllo va fatto
     sul tag dell'elemento, non cercando un iframe al suo interno */
  setTimeout(function(){
    var el=document.getElementById('player');
    if(!el || el.tagName!=='IFRAME') direttaFallita();
  }, 20000);

  setTimeout(function(){ location.reload(); }, CONFIG.oreTraRiavvii*60*60*1000);
})();
</script>
</body>
</html>
